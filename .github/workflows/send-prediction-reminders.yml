name: Send prediction reminders

on:
  schedule:
    # Ogni 15 min: l'endpoint invia il reminder appena il kickoff è entro
    # 150 min da "ora" e resta idoneo (reminderSentAt null) finché non viene
    # inviato, quindi anche ritardi/salti dello scheduler di GitHub Actions
    # non fanno perdere una partita — il giro successivo la recupera.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-prediction-reminders endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.ilgiochino.it/api/cron/send-prediction-reminders
