name: Send prediction reminders

on:
  # Lo schedule ogni 15 min è stato spostato su cron-job.org (2026-09-15):
  # GitHub Actions ritarda/salta i trigger `schedule` anche di ore sui repo
  # a bassa attività (osservato un buco di 5h25m il 2026-09-14, che ha fatto
  # perdere per sempre il reminder di Inter-Udinese perché il kickoff era
  # già passato quando il run finalmente è partito). cron-job.org chiama
  # direttamente l'endpoint con puntualità dedicata. workflow_dispatch resta
  # per poter rilanciare manualmente in caso di bisogno.
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-prediction-reminders endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.ilgiochino.it/api/cron/send-prediction-reminders
