name: Sync match results

on:
  # Lo schedule orario è stato spostato su cron-job.org (2026-09-15), stesso
  # motivo del reminder pronostico: GitHub Actions ritarda/salta i trigger
  # `schedule` anche di ore sui repo a bassa attività (vedi
  # send-prediction-reminders.yml). workflow_dispatch resta per rilanciare
  # manualmente in caso di bisogno.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-results endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.ilgiochino.it/api/cron/sync-results
